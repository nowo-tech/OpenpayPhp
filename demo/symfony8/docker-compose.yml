name: openpay-php-demo-symfony8

services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openpay-php-demo-symfony8-php
    working_dir: /app
    ports:
      - "${PORT:-8021}:80"
    volumes:
      - .:/app
      - ../..:/var/openpay-php
      - ./docker/frankenphp/Caddyfile.dev:/etc/frankenphp/Caddyfile.dev
      - ./docker/php-dev.ini:/usr/local/etc/php/conf.d/99-dev.ini:ro
      - composer-cache:/root/.composer/cache
    environment:
      - COMPOSER_ALLOW_SUPERUSER=1
      - APP_ENV=dev
      - APP_DEBUG=1
      - APP_SECRET=${APP_SECRET:-demo-secret}
      - FRANKENPHP_MODE=${FRANKENPHP_MODE:-worker}
      - PORT=${PORT:-8021}
      - OPENPAY_MERCHANT_ID=${OPENPAY_MERCHANT_ID:-}
      - OPENPAY_PRIVATE_KEY=${OPENPAY_PRIVATE_KEY:-}
      - OPENPAY_COUNTRY=${OPENPAY_COUNTRY:-MX}
      - OPENPAY_SANDBOX=${OPENPAY_SANDBOX:-1}
      - DEFAULT_URI=${DEFAULT_URI:-http://localhost:8021}
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - openpay-php-demo-network

volumes:
  composer-cache:
    driver: local

networks:
  openpay-php-demo-network:
    driver: bridge
